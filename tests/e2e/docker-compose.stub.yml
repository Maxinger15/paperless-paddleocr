# Full-pipeline e2e against a deterministic PaddleX /ocr stub. CPU-cheap:
# verifies consumer -> parser -> ocrmypdf -> HTTP -> hOCR -> PDF/A -> API,
# including a rotated page, but not OCR accuracy.

services:
  paperless:
    build:
      context: ../..
      dockerfile: docker/e2e.Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - paddleocr-stub
    ports:
      - "8000:8000"
    volumes:
      - ./consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_SECRET_KEY: e2e-not-a-real-secret
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_ROTATE_PAGES: "true"
      # OCRmyPDF's image-to-PDF conversion lowers this fixture's OSD confidence
      # from 14.54 on the source PNG to 9.78. Keep the production default
      # untouched while exercising the actual rotate-pages callback in E2E.
      PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: "8"
      PAPERLESS_PADDLEOCR_SERVER_URL: http://paddleocr-stub:8080
      PAPERLESS_CONSUMER_POLLING: "5"

  paddleocr-stub:
    image: python:3.12-slim
    restart: unless-stopped
    volumes:
      - ./stub_paddlex.py:/srv/stub_paddlex.py:ro
    command: ["python", "/srv/stub_paddlex.py"]
    expose:
      - "8080"

  redis:
    image: redis:8
    restart: unless-stopped

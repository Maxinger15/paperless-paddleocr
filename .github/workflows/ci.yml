name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-docs:
    name: YAML and Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          config: .markdownlint.yaml
          globs: "**/*.md"

  static:
    name: Ruff and MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static-check dependencies
        run: |
          python -m pip install --upgrade pip ruff mypy
          python -m pip install "ocrmypdf>=17.4" httpx numpy pillow
      - name: Ruff lint
        run: ruff check paperless_paddleocr tests
      - name: Ruff format
        run: ruff format --check paperless_paddleocr tests
      - name: MyPy
        run: mypy paperless_paddleocr

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pikepdf
      - name: Run full unit suite
        run: pytest tests/test_*.py -q

  build:
    name: Build and wheel import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build
      - name: Verify wheel installation and import
        run: |
          python -m venv /tmp/paperless-paddleocr-wheel
          /tmp/paperless-paddleocr-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/paperless-paddleocr-wheel/bin/python -c "import paperless_paddleocr; print(paperless_paddleocr.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  paperless-smoke:
    name: Paperless 3.0.2 parser smoke
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/paperless-ngx/paperless-ngx:3.0.2
      options: --entrypoint /bin/bash
    steps:
      - uses: actions/checkout@v4
      - name: Locate Paperless Python
        id: py
        run: |
          if [ -x /usr/src/paperless/.venv/bin/python ]; then
            echo "bin=/usr/src/paperless/.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "bin=$(command -v python3)" >> "$GITHUB_OUTPUT"
          fi
      - name: Install package and run parser-discovery smoke
        env:
          PYTHONPATH: /usr/src/paperless/src
          DJANGO_SETTINGS_MODULE: paperless.settings
          PAPERLESS_REDIS: redis://localhost:6379
          PAPERLESS_DBENGINE: sqlite
          PAPERLESS_SECRET_KEY: smoke-test-not-a-real-secret
        run: |
          "${{ steps.py.outputs.bin }}" -m pip install --break-system-packages .
          "${{ steps.py.outputs.bin }}" tests/smoke_paperless.py
